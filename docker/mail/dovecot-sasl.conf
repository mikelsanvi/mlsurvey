# Dovecot aqui no sirve buzones: solo presta su SASL a Postfix, que no
# sabe autenticar por su cuenta.

# Sin TLS entre la aplicacion y este contenedor (red interna de compose),
# asi que hay que permitir PLAIN/LOGIN en claro.
disable_plaintext_auth = no
auth_mechanisms = plain login

# passdb estatico: acepta cualquier usuaria cuya clave sea esta. En
# desarrollo interesa no tener que dar de alta a nadie.
#
# El marcador lo sustituye el entrypoint por MAIL_PASSWORD: dovecot 2.3
# no expande %{env:...} al leer los argumentos de un passdb.
passdb {
  driver = static
  args = password=__MAIL_PASSWORD__
}

userdb {
  driver = static
  args = uid=catchall gid=catchall home=/var/mail/catchall
}

# El socket va dentro del chroot de Postfix, que es donde smtpd lo busca.
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}

log_path = /dev/stderr
info_log_path = /dev/stderr
